[project]
name = "mcp-control-room-backend"
version = "0.1.0"
description = "MCP Control Room Backend - FastAPI + MCP Server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "supabase>=2.10.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.4.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "mcp>=1.0.0",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "tenacity>=8.5.0",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
    "faker>=33.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "ARG", "B", "COM", "DTZ", "EXE", "FA", "ISC", "ICN", "LOG", "PTH", "PL", "PT", "Q", "RET", "SIM", "T20", "TCH", "TID", "TRY", "RSE", "RUF", "PERF", "PYI", "T10", "PD", "PIE", "TD", "NPY"]
ignore = ["E501", "ANN101", "ANN102", "ANN103", "ARG001", "ARG002", "B008", "C901", "D100", "D101", "D102", "D103", "D104", "D105", "D107", "ERA001", "EXE005", "FBT001", "FBT002", "FBT003", "ISC001", "ISC002", "LOG015", "PD011", "PIE001", "PLW0602", "PT004", "PT012", "RUF001", "RUF002", "RUF003", "RUF006", "RUF012", "RUF013", "RUF100", "S101", "S102", "S106", "S311", "SIM103", "SIM115", "TRY003", "T201", "T203", "TCH001", "TCH002", "TCH003", "TID252", "UP035"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]